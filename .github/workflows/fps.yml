name: Aurora Breach FPS - Windows
on:
  push:
    branches: [main]
    paths: ['fps/**', '.github/workflows/fps.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download Godot and Windows export template
        shell: python
        run: |
          import urllib.request,zipfile,pathlib,os
          base=pathlib.Path('build-tools');base.mkdir(exist_ok=True)
          release='https://github.com/godotengine/godot/releases/download/4.6.3-stable/'
          urllib.request.urlretrieve(release+'Godot_v4.6.3-stable_win64.exe.zip',base/'editor.zip')
          with zipfile.ZipFile(base/'editor.zip') as z:z.extractall(base)
          urllib.request.urlretrieve(release+'Godot_v4.6.3-stable_export_templates.tpz',base/'templates.tpz')
          dest=pathlib.Path(os.environ['APPDATA'])/'Godot/export_templates/4.6.3.stable';dest.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(base/'templates.tpz') as z:
            (dest/'windows_release_x86_64.exe').write_bytes(z.read('templates/windows_release_x86_64.exe'))
          exe=next(base.glob('*console.exe'),next(base.glob('Godot*.exe')))
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('GODOT_EXE='+str(exe.resolve())+'\n')
      - name: Import and test models, animation and gameplay
        shell: pwsh
        run: |
          & $env:GODOT_EXE --headless --path fps --editor --import --quit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:GODOT_EXE --headless --path fps --script res://tests/suite.gd 2>&1 | Tee-Object -FilePath fps-tests.log
          if ($LASTEXITCODE -ne 0 -or (Select-String -Path fps-tests.log -Pattern 'SCRIPT ERROR|ERROR:' -Quiet)) { throw 'FPS test failure' }
      - name: Export and verify executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/Aurora | Out-Null
          & $env:GODOT_EXE --headless --path fps --export-release "Windows Desktop" ../build/Aurora/AuroraBreach.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item fps/README.md build/Aurora/
          Copy-Item LICENSE build/Aurora/
          $p=Start-Process build/Aurora/AuroraBreach.exe -ArgumentList '--headless','--','--smoke' -Wait -PassThru -RedirectStandardOutput exe.log -RedirectStandardError exe-errors.log
          Get-Content exe.log
          Get-Content exe-errors.log
          if ($p.ExitCode -ne 0 -or !(Select-String -Path exe.log -Pattern 'AURORA_EXE_OK' -Quiet) -or (Select-String -Path exe-errors.log -Pattern 'SCRIPT ERROR|ERROR:' -Quiet)) { throw 'Export verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Aurora-Breach-Windows
          path: build/Aurora/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Aurora-test-report
          path: |
            fps-tests.log
            exe.log
            exe-errors.log
